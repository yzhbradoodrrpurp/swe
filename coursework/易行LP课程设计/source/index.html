<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>易行 LP · 线性规划建模与求解</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><span class="brand">易行 LP</span><span class="tag">线性规划建模与求解</span></div><div>易治行 · 2023141220023</div></header>
<main><div class="toolbar"><div><h1>从问题陈述到规划方案</h1><p>人工确认模型，计算交给工具。所有决策变量均为非负连续变量。</p></div><div class="actions"><label>示例 <select id="example"><option value="tanner">教师原型 · Tanner</option><option value="original">故事 · 初始模型</option><option value="revised">故事 · 补充销量约束</option><option value="min">最小化问题</option><option value="infeasible">无可行解</option><option value="unbounded">无界问题</option></select></label><button id="loadExample">载入</button><button id="save">导出项目</button><button id="openProject">导入项目</button><input id="projectFile" type="file" accept=".json" hidden></div></div>
<div class="workspace"><section class="statement"><div class="section-head"><h2>01 问题陈述</h2><button id="importText">导入文本</button><input id="textFile" type="file" accept=".txt,text/plain" hidden></div><textarea id="narrative" aria-label="问题陈述" placeholder="写下业务目标、已知资源、约束条件和假设。"></textarea><label class="block">建模假设与审核记录<textarea id="assumptions" aria-label="建模假设" placeholder="例如：单位利润固定，活动水平可连续变化，销售上限由用户给定。"></textarea></label><p class="hint">导入仅载入文字，不自动识别目标或约束；请结合业务事实人工审核。</p></section>
<section class="wizard"><h2>02 建模向导</h2><div class="target"><label>目标 <select id="sense"><option value="max">max 最大化</option><option value="min">min 最小化</option></select></label><span>目标值 z</span></div><div class="section-head"><h3>竞争性活动</h3><button id="addVariable">＋ 活动</button></div><div id="variables"></div><div class="section-head"><h3>资源与约束</h3><button id="addConstraint">＋ 约束</button></div><p class="hint">表内均可编辑。≤、≥、= 可求解；严格不等式需先由你确认处理方式。</p><div class="scroll"><table id="coefficients"></table></div><div class="model-head"><h3>数学模型</h3><button class="primary" id="build">建模</button></div><pre id="modelText">请检查输入后点击“建模”。</pre><div class="bottom"><span id="modelState">尚未建模</span><button class="primary" id="solve" disabled>计算规划方案</button></div></section></div>
<div id="message" role="status" aria-live="polite"></div><footer>本地运行，无需账号或网络 · 单纯形法 · 不提供整数规划、自动业务判断或销售预测</footer></main>
<dialog id="result"><div class="section-head"><h2>规划方案</h2><button id="closeResult">关闭</button></div><div id="resultBody"></div><div class="result-actions"><button id="exportResult">导出计算记录</button></div></dialog>
<script src="solver.js"></script><script src="examples.js"></script><script src="app.js"></script></body></html>
